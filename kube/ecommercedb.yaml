apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ecommerce-db
spec:
  serviceName: "ecommerce-db"
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce-db
  template:
    metadata:
      labels:
        app: ecommerce-db
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  key: username
                  name: database-credentials
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  key: password
                  name: database-credentials
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  key: DATABASE_NAME
                  name: config
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: ecommercedb
spec:
  selector:
    app: ecommerce-db
  clusterIP: None
  ports:
    - port: 5432
      targetPort: 5432