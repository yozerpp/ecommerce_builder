apiVersion: apps/v1
kind: Deployment
metadata:
  name: ecommerce
  labels:
    app: ecommerce
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ecommerce
  template:
    metadata:
      name: ecommerce
      labels:
        app: ecommerce
    spec:
      containers:
        - name: ecommerce
          image: yusufozer1/ecommerce:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 5001
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-internal
spec:
  selector:
    app: ecommerce
  ports:
    - protocol: TCP
      port: 5001
      targetPort: 5001
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: ecommerce-external
spec:
  selector:
    app: ecommerce
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP
  type: NodePort