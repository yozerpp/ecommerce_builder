apiVersion: apps/v1
kind: Deployment
metadata:
  name: editor
  labels:
    app: editor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: editor
  template:
    metadata:
      name: editor
      labels:
        app: editor
    spec:
      containers:
        - name: editor
          image: yusufozer1/ecommerce_builder-editor:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              protocol: TCP
            - containerPort: 5005
              protocol: TCP
      restartPolicy: Always
---
apiVersion: v1
kind: Service
metadata:
  name: editor-service
spec:
    selector:
        app: editor
    ports:
      - protocol: TCP
        port: 80
        targetPort: 8080
        name: external
      - protocol: TCP
        port: 5005
        nodePort: 30006
        name: debug
    type: NodePort